name: Universal Zip to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip and Build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Unzipping: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d unzipped_project

          GRADLE_FILE=$(find unzipped_project -name "build.gradle*" | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            echo "Detected Android Studio Project!"
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            cd "$PROJECT_DIR"
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug --stacktrace
            else
              gradle assembleDebug --stacktrace
            fi
            APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
            cp "$APK_PATH" "$GITHUB_WORKSPACE/App-Ready.apk"
          else
            echo "Detected HTML/JS Web App! Wrapping into Android APK..."
            HTML_FILE=$(find unzipped_project -name "index.html" | head -n 1)
            WEB_DIR=$(dirname "$HTML_FILE")
            mkdir -p web_wrapper/www
            cp -r "$WEB_DIR"/* web_wrapper/www/
            cd web_wrapper
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "MyApp" "com.mygame.app" --web-dir www
            npx cap add android
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
            APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
            cp "$APK_PATH" "$GITHUB_WORKSPACE/App-Ready.apk"
          fi

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Ready-APK
          path: ./App-Ready.apk

      - name: Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ready APK (Build #${{ github.run_number }})"
          files: ./App-Ready.apk
